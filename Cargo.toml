[package]
name = "refraction"
version = "2.0.0"
edition = "2021"
repository = "https://github.com/PrismLauncher/refraction"
license = "GPL-3.0-or-later"
readme = "README.md"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
gray_matter = "0.3.2"
poise = "0.7.0"
serde = "1.0.229"
serde_json = "1.0.151"

[dependencies]
color-eyre = "0.6.5"
dotenvy = "0.15.7"
enum_dispatch = "0.3.13"
env_logger = "0.11.11"
eyre = "0.6.14"
log = "0.4.34"
poise = "0.7.0"
octocrab = "0.54.2"
redis = { version = "1.7.0", features = ["tokio-comp", "tokio-rustls-comp"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
rustls = "0.23.45"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
complexity = "warn"
correctness = "deny"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "deny"
